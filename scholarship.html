<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNMUTED Scholarship Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50">
  <div class="max-w-4xl mx-auto px-5 py-12">
    <a href="index.html" class="inline-flex items-center gap-2 text-amber-700 hover:text-amber-900 mb-6">← Back to Home</a>
    
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-r from-amber-800 to-amber-900 p-8 text-white text-center">
        <i class="fas fa-trophy text-5xl mb-3"></i>
        <h1 class="text-3xl font-bold">UNMUTED Merit Scholarship</h1>
        <p class="text-amber-100 mt-2">Up to 50% tuition waiver for exceptional students</p>
      </div>
      
      <form class="p-8 space-y-6" id="scholarshipForm">
        <div class="grid md:grid-cols-2 gap-6">
          <div><label class="block font-semibold mb-2">Full Name *</label><input type="text" required class="w-full p-3 border rounded-lg"></div>
          <div><label class="block font-semibold mb-2">Date of Birth *</label><input type="date" required class="w-full p-3 border rounded-lg"></div>
          <div><label class="block font-semibold mb-2">Email *</label><input type="email" required class="w-full p-3 border rounded-lg"></div>
          <div><label class="block font-semibold mb-2">Phone *</label><input type="tel" required class="w-full p-3 border rounded-lg"></div>
          <div><label class="block font-semibold mb-2">School Name *</label><input type="text" required class="w-full p-3 border rounded-lg"></div>
          <div><label class="block font-semibold mb-2">Current Grade *</label><select required class="w-full p-3 border rounded-lg"><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div>
        </div>
        
        <div><label class="block font-semibold mb-2">Why do you deserve this scholarship? (300 words max) *</label><textarea rows="4" required class="w-full p-3 border rounded-lg" placeholder="Tell us about your passion for debate, leadership experience, and financial need..."></textarea></div>
        
        <div><label class="block font-semibold mb-2">Previous Debate Experience (if any)</label><textarea rows="3" class="w-full p-3 border rounded-lg" placeholder="List any competitions, awards, or debate clubs you've participated in..."></textarea></div>
        
        <div><label class="block font-semibold mb-2">Upload Academic Transcript (PDF)</label><input type="file" accept=".pdf" class="w-full p-3 border rounded-lg"></div>
        
        <div class="flex items-center gap-2"><input type="checkbox" required><span>I confirm that all information provided is accurate</span></div>
        
        <button type="submit" class="w-full bg-amber-700 text-white py-3 rounded-lg font-bold hover:bg-amber-800 transition">Submit Scholarship Application →</button>
      </form>
    </div>
  </div>
  
  <script>
    document.getElementById('scholarshipForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      alert('✓ Application submitted! Our scholarship committee will review and contact you within 5 business days.');
      this.reset();
    });
  </script>
</body>
</html>
